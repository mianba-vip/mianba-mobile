name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install deps
        run: npm ci

      - name: Build web (bake API base)
        env:
          VITE_API_BASE: https://mianba.vip
        run: npm run build

      - name: Verify API base baked into bundle
        run: grep -rq "mianba.vip" dist/assets/

      - name: Capacitor sync
        run: npx cap sync android

      - name: Switch maven repos (境外 runner 直连官方源)
        run: |
          cd android
          # 本机的 aliyun 镜像对境外 runner 返回 502；CI 构建时切回官方源
          # （wrapper 的腾讯镜像同理）。本机构建不受影响，仓库文件保持不变。
          find . -name "*.gradle" -exec sed -i             -e "s|https://maven.aliyun.com/repository/google|https://maven.google.com|g"             -e "s|https://maven.aliyun.com/repository/central|https://repo.maven.apache.org/maven2|g"             -e "s|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g"             -e "s|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g"             {} +
          sed -i "s|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.14.3-all.zip|" gradle/wrapper/gradle-wrapper.properties

      - name: Gradle assembleDebug
        run: |
          cd android
          sh gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianba-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
